[package]
name = "twig-meta"
version.workspace = true
edition.workspace = true
license.workspace = true
# fig's Rust port asks for 1.88 (its let chains).
rust-version = "1.88"
description = "The config a document carries — its frontmatter or endmatter — read and edited in place through fig, with comments and fences kept."
repository.workspace = true
homepage.workspace = true

[dependencies]
twig-doc.workspace = true
# fig 7 is fig's Rust port, on crates.io: `fig` is its binding, and each
# language is a crate of its own on fig's kit.
# fig, and the four languages a document's metadata is written in most:
# YAML (`---`), TOML (`+++`), JSON and figl (`---json`, `---figl`). Each
# without serde, through its `fig` feature: `format()` registers it the
# first time it is asked for. A program that registers more of fig's
# languages has them read too, by the fence's tag.
fig = "7"
fig-yaml = { version = "7", default-features = false, features = ["fig"] }
fig-toml = { version = "7", default-features = false, features = ["fig"] }
fig-json = { version = "7", default-features = false, features = ["fig"] }
fig-figl = { version = "7", default-features = false, features = ["fig"] }

# The document languages the tests read metadata out of. By path, so `cargo
# publish` drops them.
[dev-dependencies]
twig-markdown = { path = "../twig-markdown" }
twig-djot = { path = "../twig-djot" }
twig-html = { path = "../twig-html" }
twig-asciidoc = { path = "../twig-asciidoc" }
