[package]
# Published as `twig-doc` because the plain `twig` crate name is taken. The
# library itself is still Twig: `[lib] name` stays `twig`, so consumers write
# `use twig::…`.
name = "twig-doc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parse, query, edit, and losslessly round-trip documents, in whatever languages a program registers (twig-markdown, twig-djot, twig-html, twig-xml, twig-asciidoc). Pure Rust."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["djot", "markdown", "parser", "ast", "document"]
categories = ["parser-implementations", "text-processing"]
# fig, behind the default `fig` feature, asks for 1.88 (its let chains).
rust-version = "1.88"

[lib]
name = "twig"
path = "src/lib.rs"

[dependencies]
twig-kit.workspace = true
# fig, and the four languages a document's metadata is written in most:
# YAML (`---`), TOML (`+++`), JSON and figl (`---json`, `---figl`), each
# without serde. `twig::meta` reads and edits a document's frontmatter
# through them, and parsing honours the `twig` settings it holds.
fig = { version = "7", optional = true }
fig-yaml = { version = "7", default-features = false, features = ["fig"], optional = true }
fig-toml = { version = "7", default-features = false, features = ["fig"], optional = true }
fig-json = { version = "7", default-features = false, features = ["fig"], optional = true }
fig-figl = { version = "7", default-features = false, features = ["fig"], optional = true }

[features]
# fig: a document's metadata read and edited in place (`twig::meta`), and a
# document read as its frontmatter's `twig` settings ask. Off, twig parses
# exactly as the caller asks and has no dependency but the kit.
default = ["fig"]
fig = ["dep:fig", "dep:fig-yaml", "dep:fig-toml", "dep:fig-json", "dep:fig-figl"]

# The language crates, for the tests: the unit tests register each crate's
# language value with this crate's registry (`src/test_languages.rs`), the
# README its `format()`. By path, so `cargo publish` drops them: each is
# published after this crate.
[dev-dependencies]
twig-djot = { path = "../twig-djot" }
twig-markdown = { path = "../twig-markdown" }
twig-html = { path = "../twig-html" }
twig-xml = { path = "../twig-xml" }
twig-asciidoc = { path = "../twig-asciidoc" }
