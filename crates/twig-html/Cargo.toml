[package]
name = "twig-html"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTML for twig: a forgiving document-oriented HTML parser and its editing table, on twig's kit."
repository.workspace = true
homepage.workspace = true
keywords = ["html", "twig", "parser", "document"]
categories = ["parser-implementations", "text-processing"]
rust-version.workspace = true

[dependencies]
# The language itself is written on twig's kit alone.
twig-kit.workspace = true
twig-doc = { workspace = true, optional = true }

[dev-dependencies]
twig-markdown = { path = "../twig-markdown", default-features = false }

[features]
# `register()` and `format()`: the language through `twig-doc`'s registry.
# Off (`default-features = false`), the crate is the language alone, on
# `twig-kit`, for a program that registers it with `twig::register` itself.
default = ["twig"]
twig = ["dep:twig-doc"]
