[package]
name = "twig-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The C ABI of Twig (bindings/c/include/twig.h), implemented in Rust over the twig-doc crate."
repository.workspace = true
publish = false

[lib]
name = "twig"
crate-type = ["staticlib", "cdylib"]
# The lib shares its name with the engine it depends on, which rustdoc's
# doctest harness cannot tell apart; the tests are unit tests in src/tests.rs.
doctest = false

[dependencies]
# With fig: a document is read as its frontmatter's `twig` settings ask.
twig-doc = { workspace = true, features = ["fig"] }
# The metadata entry points write a block's body as JSON through fig, the
# same fig 7 twig-doc reads it with.
fig = "7"
# The bundle: every language twig ships, registered under its TWIG_FORMAT_*
# code before the first entry point answers.
twig-djot = { workspace = true, default-features = true }
twig-markdown = { workspace = true, default-features = true }
twig-xml = { workspace = true, default-features = true }
twig-html = { workspace = true, default-features = true }
twig-asciidoc = { workspace = true, default-features = true }
