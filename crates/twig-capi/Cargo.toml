[package]
name = "twig-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The C ABI of Twig (bindings/c/include/twig.h), implemented in Rust over the twig-doc crate."
repository = "https://github.com/diaryx-org/twig"
publish = false

[lib]
name = "twig"
crate-type = ["staticlib", "cdylib", "rlib"]
# The lib shares its name with the engine it depends on, which rustdoc's
# doctest harness cannot tell apart; the tests are unit tests in src/tests.rs.
doctest = false

[dependencies]
twig-doc = { path = "../twig" }
