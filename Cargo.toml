[workspace]
resolver = "3"
members = ["crates/twig-kit", "crates/twig", "crates/twig-djot", "crates/twig-markdown", "crates/twig-html", "crates/twig-xml", "crates/twig-asciidoc", "crates/twig-rst", "crates/twig-cli", "crates/twig-capi"]
default-members = ["crates/twig-kit", "crates/twig", "crates/twig-djot", "crates/twig-markdown", "crates/twig-html", "crates/twig-xml", "crates/twig-asciidoc", "crates/twig-rst", "crates/twig-cli"]

[workspace.package]
version = "6.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/diaryx-org/twig"
homepage = "https://github.com/diaryx-org/twig"

[workspace.dependencies]
twig-doc = { path = "crates/twig", version = "6.0.0", default-features = false }
twig-kit = { path = "crates/twig-kit", version = "6.0.0" }
twig-djot = { path = "crates/twig-djot", version = "6.0.0", default-features = false }
twig-markdown = { path = "crates/twig-markdown", version = "6.0.0", default-features = false }
twig-html = { path = "crates/twig-html", version = "6.0.0", default-features = false }
twig-xml = { path = "crates/twig-xml", version = "6.0.0", default-features = false }
twig-asciidoc = { path = "crates/twig-asciidoc", version = "6.0.0", default-features = false }
twig-rst = { path = "crates/twig-rst", version = "6.0.0", default-features = false }

[profile.release]
debug = 1
