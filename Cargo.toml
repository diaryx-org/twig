[workspace]
resolver = "3"
members = ["crates/twig-kit", "crates/twig", "crates/twig-djot", "crates/twig-markdown", "crates/twig-html", "crates/twig-xml", "crates/twig-asciidoc", "crates/twig-rst", "crates/twig-cli", "crates/twig-capi"]
default-members = ["crates/twig-kit", "crates/twig", "crates/twig-djot", "crates/twig-markdown", "crates/twig-html", "crates/twig-xml", "crates/twig-asciidoc", "crates/twig-rst", "crates/twig-cli"]

[workspace.package]
version = "7.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/diaryx-org/twig"
homepage = "https://github.com/diaryx-org/twig"

[workspace.dependencies]
twig-doc = { path = "crates/twig", version = "7.0.1", default-features = false }
twig-kit = { path = "crates/twig-kit", version = "7.0.1" }
twig-djot = { path = "crates/twig-djot", version = "7.0.1", default-features = false }
twig-markdown = { path = "crates/twig-markdown", version = "7.0.1", default-features = false }
twig-html = { path = "crates/twig-html", version = "7.0.1", default-features = false }
twig-xml = { path = "crates/twig-xml", version = "7.0.1", default-features = false }
twig-asciidoc = { path = "crates/twig-asciidoc", version = "7.0.1", default-features = false }
twig-rst = { path = "crates/twig-rst", version = "7.0.1", default-features = false }

[profile.release]
debug = 1

# The WebAssembly module `@diaryx/twig` inlines (bindings/typescript), built
# for size: `cargo build -p twig-capi --profile wasm --target
# wasm32-unknown-unknown`, as fig builds `@diaryx/fig`'s.
[profile.wasm]
inherits = "release"
debug = 0
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
