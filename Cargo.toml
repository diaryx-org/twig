# The pure-Rust Twig. `bindings/rust` is the older FFI binding over the Zig
# library and keeps its own workspace; it is excluded here.
[workspace]
resolver = "3"
members = ["crates/twig", "crates/twig-capi"]
exclude = ["bindings"]

[workspace.package]
version = "5.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
debug = 1
