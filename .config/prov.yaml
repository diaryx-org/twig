title: prov config
spec: 1
content_format: markdown
metadata:
  format: yaml
  embed: delimited
references:
  notation: markdown
  path_style: root
  target: path
  label: false
id_storage: both
updated: ''
identity: lazy
fixity: on
recycle_bin: false
history: off
about: off
workspace_id: twig
root: README.md
fields:
  audience:
    values: closed
    vocabulary: '[Audiences](/vocab/audiences.md)'
    reify: true
  created: { type: datetime }
  date_of_document: { type: date }
  status:
  - under: '[[Tasks]]'
    values: closed
    vocabulary: '[Task statuses](/vocab/task-statuses.yaml)'
    default: open
  - under: '[[Proposals]]'
    values: closed
    vocabulary: '[Proposal statuses](/vocab/proposal-statuses.yaml)'
    default: draft
  updated: { type: datetime }
views:
  open-tasks:
    label: Open tasks
    group: status
    under: '[[Tasks]]'
    where:
      has: status
      not:
        any-of:
          - equals: { status: done }
          - equals: { status: dropped }
  proposals:
    label: Proposals
    group: status
    under: '[[Proposals]]'
    where: { has: status }
  work:
    label: All work
    group: status
    where: { has: status }
exports:
  www:
    label: twig on diaryx.org
    gate: { field: audience, value: public }
    hold: draft
created: ''
record_deletions: false
