title: prov config
spec: 1
content_format: markdown
metadata:
  format: yaml
  embed: delimited
references:
  notation: markdown
  path_style: root
  target: path
  label: false
id_storage: both
identity: lazy
fixity: on
recycle_bin: false
history: off
about: off
workspace_id: twig
root: README.md
fields:
  audience:
    values: closed
    vocabulary: '[Audiences](/vocab/audiences.md)'
    reify: true
  created: { type: datetime }
  date_of_document: { type: date }
  status:
  - under: '[[Tasks]]'
    values: closed
    vocabulary: '[Task statuses](/vocab/task-statuses.yaml)'
    default: open
  - under: '[[Proposals]]'
    values: closed
    vocabulary: '[Proposal statuses](/vocab/proposal-statuses.yaml)'
    default: draft
  updated: { type: datetime }
views:
  open-tasks:
    label: "Open tasks"
    where: "under('[[Tasks]]') && present(status) && !('done' in field('status') || 'dropped' in field('status'))"
    key: "status"
  proposals:
    label: "Proposals"
    where: "under('[[Proposals]]') && present(status)"
    key: "status"
  work:
    label: "All work"
    where: "present(status)"
    key: "status"
exports:
  www:
    label: twig on diaryx.org
    gate: { field: audience, value: public }
    hold: draft
record_deletions: false
