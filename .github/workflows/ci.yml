name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The workspace's own test suite: the engine (twig-doc), the CLI
  # (twig-doc-cli), the C ABI (twig-capi), the kit and the language crates,
  # with twig-doc's default fig feature (fig 7, from crates.io),
  # across Linux and macOS.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --release

      # The core without fig: no dependency but the kit.
      - name: Test twig-doc without fig
        run: cargo test -p twig-doc --release --no-default-features

  # The CLI also ships as a wasm32-wasip1 download (homebrew.yml), so keep it
  # building for that target.
  cli-wasi:
    name: CLI on wasm32-wasip1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p twig-doc-cli --target wasm32-wasip1

  # The C ABI: the header's behavioural test linked against the static
  # library, and the wasm module JS consumers load.
  capi:
    name: C ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Header test against libtwig.a
        run: |
          cargo build --release -p twig-capi
          cc -std=c99 -Wall -I bindings/c/include bindings/c/test/header_test.c \
             target/release/libtwig.a -lpthread -ldl -lm -o header_test
          ./header_test

      - name: Build the wasm module
        run: cargo build --release -p twig-capi --target wasm32-unknown-unknown

  # `@diaryx/twig` (bindings/typescript): the wasm module built from
  # twig-capi and inlined, the TypeScript compiled, the suite run, and the
  # package's version held to the workspace's.
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # Node 24+ for the tests, not for the package (engines is >=22): the
      # suite runs its .ts files under Node's built-in type stripping and uses
      # `using`, which Node has from 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Version check
        run: node bindings/typescript/scripts/version-sync.mjs --check

      - run: npm ci
        working-directory: bindings/typescript

      - run: npm run build
        working-directory: bindings/typescript

      - run: npm test
        working-directory: bindings/typescript
