name: Release

# Publishes the Twig crates to crates.io and cuts a GitHub release when a
# version tag is pushed. Tag the commit `v<major>.<minor>.<patch>` (matching
# `[workspace.package] version` in Cargo.toml) to trigger it, e.g.
# `git tag v1.0.0 && git push origin v1.0.0`. `workflow_dispatch` allows a
# manual dry run (publish is skipped unless the run was triggered by a tag).
#
# The crate graph is published bottom-up, because crates.io rejects an upload
# whose dependencies aren't already on the index:
#   1. twig-doc      (the engine; no dependencies)
#   2. twig-doc-cli  (the `twig` binary; depends on twig-doc and clap)
# twig-capi is `publish = false`: the C ABI ships as source, built with cargo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release

jobs:
  publish:
    name: publish crates
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because git-cliff walks the tag history to work out
      # which commits belong to this release; a shallow clone has no tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Gate the release on a green workspace before anything is published.
      - name: Test
        run: cargo test --workspace --release

      # Fail early if the pushed tag doesn't match the workspace version, so a
      # mistagged release can't publish the wrong number.
      - name: Verify tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "twig-doc"))')"
          tag="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml=$version tag=$tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi

      # Ordered publish, each crate after the ones it depends on: the kit, the
      # core, the languages (Markdown after HTML, whose parser it reads raw HTML
      # with), then the CLI. A re-run after a partial
      # publish must not choke on the crate that DID land, so an "already
      # uploaded/exists" response is treated as success and the job is safe to
      # re-run. crates.io throttles new-crate creation, so a rate-limit
      # response waits out one refill window and retries.
      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          publish() {
            local crate="$1" attempt out
            for attempt in $(seq 1 8); do
              echo "::group::cargo publish -p $crate (attempt $attempt)"
              if out=$(cargo publish -p "$crate" 2>&1); then
                echo "$out"; echo "::endgroup::"; return 0
              fi
              echo "$out"; echo "::endgroup::"
              if echo "$out" | grep -qiE 'already (uploaded|exists)'; then
                echo "::notice::$crate already on crates.io — skipping"; return 0
              fi
              if echo "$out" | grep -qiE 'rate limit|too many|429|try again'; then
                echo "::warning::$crate rate-limited by crates.io; waiting 11m for refill"
                sleep 660; continue
              fi
              echo "$crate publish failed; retrying in 30s (index propagation?)"
              sleep 30
            done
            echo "::error::failed to publish $crate after retries"; return 1
          }
          publish twig-kit
          publish twig-doc
          publish twig-html
          publish twig-markdown
          publish twig-djot
          publish twig-xml
          publish twig-asciidoc
          publish twig-doc-cli

      # Manual (workflow_dispatch) dry run: every published crate packages and
      # verify-builds together, each against the others' packages rather than
      # the index, so a version not yet published still checks.
      - name: Package (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cargo package -p twig-kit -p twig-doc -p twig-html -p twig-markdown \
            -p twig-djot -p twig-xml -p twig-asciidoc -p twig-doc-cli

      # Release notes from the same .config/cliff.toml that writes CHANGELOG.md's
      # Unreleased region, so the two group commits identically. This replaces
      # GitHub's generate_release_notes, which grouped by PR author rather than
      # by change type and ignored the `add(scope):` convention entirely.
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@v4
        with:
          config: .config/cliff.toml
          args: --current --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
