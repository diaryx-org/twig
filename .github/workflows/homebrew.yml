name: Homebrew
# Release the `twig` CLI to Homebrew. The build/attach/render/push mechanics are
# shared with fig and moid and live in diaryx-org/.github; only what makes twig
# different is below.
#
# twig's build.zig exposes just the standard target/optimize options — there is
# no `-Dstrip` flag (fig has one), so `zig-flags` is left at its default.
#
# `wasi: true` attaches a wasm32-wasi build to the same Release. It is not part
# of the Homebrew formula (brew doesn't run wasm) — just a portable download for
# any WASI runtime (wasmtime, wasmer, ...).
#
# Runs on the same `v*.*.*` tag as release.yml (the crates.io publish); both use
# softprops/action-gh-release, which upserts the same Release, so attaching
# binaries here and generating notes there don't conflict.
#
# Prerequisite before the first tagged release succeeds: install the diaryx-bot
# GitHub App on diaryx-org/homebrew-tap (Contents:write) and add its App ID +
# private key as the TAP_APP_ID / TAP_APP_KEY secrets on this repo.
on:
  push: { tags: [v*.*.*] }
  workflow_dispatch:
permissions:
  contents: write # caps what the called workflow may request
jobs:
  homebrew:
    uses: diaryx-org/.github/.github/workflows/reusable-homebrew.yml@main
    with:
      name: twig
      desc: "Parse, query, edit, and losslessly round-trip Djot, Markdown, HTML, and XML documents"
      language: zig
      wasi: true
    secrets:
      TAP_APP_ID: ${{ secrets.TAP_APP_ID }}
      TAP_APP_KEY: ${{ secrets.TAP_APP_KEY }}
